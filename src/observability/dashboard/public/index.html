<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAM Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <h1>CAM Dashboard</h1>
        <span class="connection-status" id="connectionStatus">Connecting...</span>
      </div>
      <div class="header-stats">
        <div class="stat">
          <span class="stat-label">Uptime</span>
          <span class="stat-value" id="uptime">0s</span>
        </div>
        <div class="stat">
          <span class="stat-label">Clients</span>
          <span class="stat-value" id="clients">0</span>
        </div>
      </div>
    </header>

    <!-- Status Bar -->
    <section class="status-bar">
      <div class="status-item">
        <span class="status-label">Model</span>
        <span class="status-value" id="model">--</span>
      </div>
      <div class="status-item">
        <span class="status-label">Context</span>
        <div class="progress-bar">
          <div class="progress-fill" id="contextProgress"></div>
          <span class="progress-text" id="contextUsage">0%</span>
        </div>
      </div>
      <div class="status-item">
        <span class="status-label">Learning</span>
        <span class="status-value" id="learningScore">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">Active Agents</span>
        <span class="status-value" id="activeAgents">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">Pending Tasks</span>
        <span class="status-value" id="pendingTasks">0</span>
      </div>
    </section>

    <!-- Main Content Grid -->
    <main class="main-content">
      <!-- Agents Panel -->
      <section class="panel agents-panel">
        <h2 class="panel-title">Agent Activity</h2>
        <div class="panel-content" id="agentsList">
          <div class="empty-state">No active agents</div>
        </div>
      </section>

      <!-- Tasks Panel -->
      <section class="panel tasks-panel">
        <h2 class="panel-title">Tasks</h2>
        <div class="panel-content" id="tasksList">
          <div class="empty-state">No tasks</div>
        </div>
      </section>

      <!-- Events Panel -->
      <section class="panel events-panel">
        <h2 class="panel-title">
          Event Log
          <button class="clear-btn" id="clearEvents">Clear</button>
        </h2>
        <div class="panel-content events-list" id="eventsList">
          <div class="empty-state">No events</div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>CAM Observability Dashboard</span>
      <span id="lastUpdate">Last update: --</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
