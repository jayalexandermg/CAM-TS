<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auragen</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f0ff;
            --bg-base: #050505;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ========================================
           LAYERED GRADIENT MESH BACKGROUND
           Multiple depth layers create ambient feel
           ======================================== */
        .bg-mesh {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Deep base layer - barely visible, sets the infinite depth */
        .mesh-layer-deep {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 100% 80% at 50% 100%, rgba(0, 240, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99, 102, 241, 0.02) 0%, transparent 40%);
        }

        /* Mid layer - primary ambient pools */
        .mesh-layer-mid {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 50% 50% at 70% 20%, rgba(0, 240, 255, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 10% 80%, rgba(168, 85, 247, 0.025) 0%, transparent 50%),
                radial-gradient(ellipse 40% 60% at 90% 70%, rgba(0, 240, 255, 0.02) 0%, transparent 40%);
        }

        /* Top layer - subtle highlight zones */
        .mesh-layer-top {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 30% 30% at 50% 0%, rgba(255, 255, 255, 0.015) 0%, transparent 50%),
                radial-gradient(ellipse 25% 40% at 80% 50%, rgba(0, 240, 255, 0.015) 0%, transparent 40%);
        }

        /* Vignette for focus */
        .mesh-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 0%, var(--bg-base) 100%);
        }

        /* ========================================
           GLASS PANEL - Primary container
           ======================================== */
        .glass-panel {
            background: linear-gradient(145deg, 
                rgba(255, 255, 255, 0.18) 0%, 
                rgba(255, 255, 255, 0.05) 40%, 
                rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            
            /* Multi-layer shadow for premium depth */
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.25) inset,  /* Top edge highlight */
                0 -1px 0 0 rgba(0, 0, 0, 0.2) inset,        /* Bottom edge shadow */
                0 4px 8px -2px rgba(0, 0, 0, 0.3),          /* Tight shadow */
                0 16px 32px -8px rgba(0, 0, 0, 0.4),        /* Mid shadow */
                0 32px 64px -16px rgba(0, 0, 0, 0.5);       /* Ambient shadow */
            
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.35) inset,
                0 -1px 0 0 rgba(0, 0, 0, 0.2) inset,
                0 4px 8px -2px rgba(0, 0, 0, 0.3),
                0 20px 40px -10px rgba(0, 0, 0, 0.45),
                0 40px 80px -20px rgba(0, 0, 0, 0.55),
                0 0 60px -20px rgba(0, 240, 255, 0.1);      /* Subtle accent glow */
        }

        /* ========================================
           PREMIUM PILLS - Smooth, layered, refined
           ======================================== */
        .pill {
            position: relative;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Base layer */
            background: linear-gradient(145deg, 
                rgba(255, 255, 255, 0.06) 0%, 
                rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            
            /* Depth through layered shadows */
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.08) inset,  /* Inner top highlight */
                0 -1px 2px 0 rgba(0, 0, 0, 0.1) inset,      /* Inner bottom shadow */
                0 2px 4px -1px rgba(0, 0, 0, 0.2),          /* Lift shadow */
                0 8px 16px -4px rgba(0, 0, 0, 0.15);        /* Ambient shadow */
        }

        .pill:hover {
            background: linear-gradient(145deg, 
                rgba(255, 255, 255, 0.1) 0%, 
                rgba(255, 255, 255, 0.04) 100%);
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            transform: translateY(-1px);
            
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.12) inset,
                0 -1px 2px 0 rgba(0, 0, 0, 0.1) inset,
                0 4px 8px -2px rgba(0, 0, 0, 0.25),
                0 12px 24px -6px rgba(0, 0, 0, 0.2);
        }

        .pill.active {
            background: linear-gradient(145deg, 
                rgba(0, 240, 255, 0.12) 0%, 
                rgba(0, 240, 255, 0.04) 100%);
            border-color: rgba(0, 240, 255, 0.25);
            color: #00f0ff;
            
            box-shadow: 
                0 1px 0 0 rgba(0, 240, 255, 0.15) inset,
                0 -1px 2px 0 rgba(0, 0, 0, 0.1) inset,
                0 2px 4px -1px rgba(0, 0, 0, 0.2),
                0 8px 16px -4px rgba(0, 0, 0, 0.15),
                0 0 20px -5px rgba(0, 240, 255, 0.15);      /* Subtle glow */
        }

        .pill.active:hover {
            box-shadow: 
                0 1px 0 0 rgba(0, 240, 255, 0.2) inset,
                0 -1px 2px 0 rgba(0, 0, 0, 0.1) inset,
                0 4px 8px -2px rgba(0, 0, 0, 0.25),
                0 12px 24px -6px rgba(0, 0, 0, 0.2),
                0 0 30px -5px rgba(0, 240, 255, 0.2);
        }

        .pill-icon {
            font-size: 16px;
            line-height: 1;
        }

        /* ========================================
           CTA BUTTON
           ======================================== */
        .cta-btn {
            background: linear-gradient(145deg, #00f0ff 0%, #00d4e0 100%);
            color: #000000;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.3) inset,
                0 -1px 0 0 rgba(0, 0, 0, 0.1) inset,
                0 4px 12px -2px rgba(0, 240, 255, 0.3),
                0 12px 24px -6px rgba(0, 240, 255, 0.2);
        }

        .cta-btn:hover {
            transform: translateY(-1px);
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.4) inset,
                0 -1px 0 0 rgba(0, 0, 0, 0.1) inset,
                0 6px 16px -2px rgba(0, 240, 255, 0.4),
                0 16px 32px -8px rgba(0, 240, 255, 0.25);
        }

        /* ========================================
           UTILITY BUTTONS
           ======================================== */
        .util-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(145deg, 
                rgba(255, 255, 255, 0.04) 0%, 
                rgba(255, 255, 255, 0.01) 100%);
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.06) inset,
                0 2px 4px -1px rgba(0, 0, 0, 0.15);
        }

        .util-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #00f0ff;
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.1) inset,
                0 4px 8px -2px rgba(0, 0, 0, 0.2),
                0 0 15px -5px rgba(0, 240, 255, 0.2);
        }

        /* ========================================
           INPUT FIELD
           ======================================== */
        .input-field {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            width: 100%;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.7;
            letter-spacing: -0.01em;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* ========================================
           HEADER ELEMENTS
           ======================================== */
        .logo-mark {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(145deg, #0a0a0a 0%, #000000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            
            box-shadow: 
                0 1px 0 0 rgba(255, 255, 255, 0.1) inset,
                0 4px 12px -2px rgba(0, 0, 0, 0.4),
                0 0 20px -5px rgba(0, 240, 255, 0.15);
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========================================
           ANIMATIONS
           ======================================== */
        .fade-in {
            animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.35s; }
        .delay-4 { animation-delay: 0.5s; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Layered Gradient Mesh Background -->
    <div class="bg-mesh">
        <div class="mesh-layer-deep"></div>
        <div class="mesh-layer-mid"></div>
        <div class="mesh-layer-top"></div>
        <div class="mesh-vignette"></div>
    </div>

    <!-- Header -->
    <header class="relative z-50 px-8 py-6 fade-in">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="logo-mark">
                    <span class="text-[#00f0ff] text-xl font-bold font-heading">A</span>
                </div>
                <span class="logo-text">Auragen</span>
            </div>
            
            <button class="util-btn">
                <i class="fa-solid fa-ellipsis text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 pb-20 relative z-10">
        
        <!-- Title -->
        <div class="text-center mb-12 fade-in delay-1">
            <h1 class="text-4xl md:text-5xl font-heading font-semibold text-white mb-4 tracking-tight">
                What are you building?
            </h1>
            <p class="text-gray-500 text-lg">
                Describe your app and we'll handle the rest.
            </p>
        </div>

        <!-- Input Card -->
        <div class="w-full max-w-2xl glass-panel p-8 mb-10 fade-in delay-2">
            
            <textarea 
                id="app-description"
                class="input-field min-h-[160px] mb-6"
                placeholder="Describe what your app does for its users..."
                rows="6"
            ></textarea>
            
            <!-- Divider -->
            <div class="h-px bg-gradient-to-r from-transparent via-white/10 to-transparent mb-6"></div>
            
            <!-- Footer -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button class="util-btn" title="Attach file">
                        <i class="fa-solid fa-paperclip text-xs"></i>
                    </button>
                    <button class="util-btn" title="Voice input">
                        <i class="fa-solid fa-microphone text-xs"></i>
                    </button>
                </div>
                
                <button class="cta-btn">
                    <span>Continue</span>
                    <i class="fa-solid fa-arrow-right text-xs opacity-70"></i>
                </button>
            </div>
        </div>

        <!-- Category Pills -->
        <div class="flex flex-wrap justify-center gap-4 fade-in delay-3">
            <button class="pill active" onclick="selectCategory(this)">
                <span class="pill-icon">🚀</span>
                <span>SaaS Product</span>
            </button>
            <button class="pill" onclick="selectCategory(this)">
                <span class="pill-icon">🏪</span>
                <span>Marketplace</span>
            </button>
            <button class="pill" onclick="selectCategory(this)">
                <span class="pill-icon">📊</span>
                <span>Dashboard</span>
            </button>
            <button class="pill" onclick="selectCategory(this)">
                <span class="pill-icon">✨</span>
                <span>Surprise Me</span>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-50 px-8 py-6 flex items-center justify-between fade-in delay-4">
        <div class="util-btn !w-11 !h-11">
            <span class="font-heading font-semibold text-sm text-gray-500">N²</span>
        </div>
        <button class="util-btn !w-11 !h-11">
            <i class="fa-solid fa-sparkles text-sm"></i>
        </button>
    </footer>

    <script>
        function selectCategory(btn) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('app-description').focus();
        }

        const textarea = document.getElementById('app-description');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 300) + 'px';
        });
    </script>
</body>
</html>
