<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auragen</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #08080a;
            --surface: #0d0d10;
            --surface-elevated: #121215;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-medium: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Premium Background - Layered Depth */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .bg-gradient-primary {
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 50% 120%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
        }

        .bg-noise {
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .bg-vignette {
            background: radial-gradient(ellipse at center, transparent 0%, var(--bg-deep) 70%);
        }

        /* Horizon Line - Subtle Depth Cue */
        .horizon {
            position: fixed;
            bottom: 30%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.03) 20%, 
                rgba(255,255,255,0.05) 50%, 
                rgba(255,255,255,0.03) 80%, 
                transparent 100%);
        }

        /* Ambient Light - Ultra Subtle */
        .ambient-light {
            position: fixed;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            transition: opacity 1.5s ease;
        }

        .ambient-1 {
            top: -400px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
        }

        .ambient-2 {
            bottom: -500px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 70%);
        }

        /* Card Surface */
        .card-surface {
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.03) 0%, 
                rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid var(--border-subtle);
            box-shadow: 
                0 0 0 1px rgba(0,0,0,0.5),
                0 20px 50px -20px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.04);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-surface:hover {
            border-color: var(--border-medium);
            box-shadow: 
                0 0 0 1px rgba(0,0,0,0.5),
                0 30px 60px -20px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* Input Area */
        .input-area {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-subtle);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-area:focus-within {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 
                0 0 0 1px rgba(99, 102, 241, 0.1),
                0 0 30px -10px var(--accent-glow);
        }

        .input-area textarea {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            width: 100%;
            color: var(--text-primary);
            font-size: 1.125rem;
            line-height: 1.7;
            letter-spacing: -0.01em;
        }

        .input-area textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* Category Pills */
        .pill {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 0.75rem 1.25rem;
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 450;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pill:hover {
            border-color: var(--border-medium);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
        }

        .pill.active {
            border-color: rgba(99, 102, 241, 0.4);
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .pill-icon {
            font-size: 1rem;
            opacity: 0.8;
        }

        /* CTA Button */
        .cta-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.875rem 1.75rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 550;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.1) inset,
                0 4px 20px -5px rgba(99, 102, 241, 0.5);
        }

        .cta-button:hover {
            transform: translateY(-1px);
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.15) inset,
                0 8px 30px -5px rgba(99, 102, 241, 0.6);
        }

        /* Icon Button */
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            border-color: var(--border-medium);
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
        }

        /* Logo */
        .logo {
            font-weight: 600;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Tagline */
        .tagline {
            color: var(--text-secondary);
            font-size: 1.125rem;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        /* Main Title */
        .main-title {
            font-size: clamp(3rem, 8vw, 4.5rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        /* Divider */
        .divider {
            height: 1px;
            background: var(--border-subtle);
        }

        /* Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        /* Subtle breathing on ambient */
        @keyframes breathe {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.5; }
        }

        .ambient-light {
            animation: breathe 8s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- Background Layers -->
    <div class="bg-layer bg-gradient-primary"></div>
    <div class="bg-layer bg-noise"></div>
    <div class="bg-layer bg-vignette"></div>
    <div class="horizon"></div>
    <div class="ambient-light ambient-1"></div>
    <div class="ambient-light ambient-2" style="animation-delay: 4s;"></div>

    <!-- Layout -->
    <div class="min-h-screen flex flex-col relative z-10">
        
        <!-- Header -->
        <header class="p-8 flex items-center justify-between fade-up">
            <div class="logo">Auragen</div>
            <button class="icon-btn">
                <i class="fa-solid fa-ellipsis text-sm"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col items-center justify-center px-6 pb-20">
            
            <!-- Hero -->
            <div class="text-center mb-12 fade-up delay-1">
                <h1 class="main-title mb-4">Build with intent.</h1>
                <p class="tagline">Custom code capabilities without the complexity.</p>
            </div>

            <!-- Input Card -->
            <div class="w-full max-w-2xl card-surface rounded-2xl p-1.5 mb-12 fade-up delay-2">
                <div class="input-area rounded-xl p-6">
                    <textarea 
                        id="app-description"
                        placeholder="Describe what you're building..."
                        rows="4"
                    ></textarea>
                    
                    <div class="divider my-4"></div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <button class="icon-btn" title="Attach">
                                <i class="fa-solid fa-paperclip text-xs"></i>
                            </button>
                            <button class="icon-btn" title="Voice">
                                <i class="fa-solid fa-microphone text-xs"></i>
                            </button>
                        </div>
                        
                        <button class="cta-button">
                            Continue
                            <i class="fa-solid fa-arrow-right text-xs opacity-70"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="flex flex-wrap justify-center gap-3 fade-up delay-3">
                <button class="pill" onclick="selectCategory(this)">
                    <span class="pill-icon">🚀</span>
                    SaaS
                </button>
                <button class="pill" onclick="selectCategory(this)">
                    <span class="pill-icon">🏪</span>
                    Marketplace
                </button>
                <button class="pill" onclick="selectCategory(this)">
                    <span class="pill-icon">📊</span>
                    Dashboard
                </button>
                <button class="pill" onclick="selectCategory(this)">
                    <span class="pill-icon">✨</span>
                    Surprise me
                </button>
            </div>

        </main>

    </div>

    <script>
        function selectCategory(btn) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('app-description').focus();
        }

        // Auto-resize textarea
        const textarea = document.getElementById('app-description');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 300) + 'px';
        });
    </script>
</body>
</html>
